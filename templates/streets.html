<body>

<marquee>
    🚨 EXTREM WICHTIGE UMFRAGE 🚨 (oder so) 🚨
</marquee>

<!--

<h1>
    MIT COOLEN BELOHUNGEN!
</h1>


<div class="box">

    <h2>
        Du studierst in Leipzig!? In welcher Straße wohnst du?
    </h2>

    <h3>
        Keine Erklärungen. Keine Likert-Skala. Nur Straße.
    </h3>


    <div class="street-search">
        <input id="street" type="text" placeholder="(: Wähle deine Straße :)">
        <ul id="suggestions"></ul>
    </div>

    <br>


    <button id="button" onclick="vote()">
        ABSCHICKN 
    </button>


    <div id="thanks">
        🎉 Thanks for participating!<br>
        Your street has been officially streeted.
    </div>

</div>


<script>
// To-Do: Die Straßenliste aus der Bewertung reinladen, Texte verschönern, Memes als Belohnung -> Maybe Device-Id oder so mit speichern? Oder drauf schaisen und Hausnummer mit abfragen?
// Wichtige Pepe-Maymays
// Bist du wirklich sicher, dass du in der 'Straßennamen Einfügen'-Straße wohnst?
// Als danke ein Maymay und maybe die Erläuterung aus der XML?
// Vote + Gehashte IP + Timestamp

// Bonusumfrage? Rundenbasiertes 1 gg 1 der Features -> Später ranken
// ELO-System aus randomized Rankings 
async function vote() {
    let street = document.getElementById("street").value;
    if (street === "") {
        alert("Du hast vergessen die Straße! 😡");
        return;
    }
    if (!streets.includes(street)) {
        alert("Bitte wähle eine Straße aus der Liste aus! 😡");
        return;
    }
    console.log("Vote:", street);
    await abschicken(street)
    document.getElementById("button").textContent = "ABGESCHICKT! 🎉"
    suggestionBox.style.display = "none";
    window.location.href = "/ranking";
    
}


// Straßennamen laden
let streets = [];

fetch("/static/straßen.json")
    .then(response => response.json())
    .then(data => {
        streets = data;
        console.log("Loaded streets:", streets);
        // Namen extrahiern
        streets.forEach(street => {
            //console.log(street);
        });
    })
    .catch(error => console.error("Error loading streets:", error));



const input = document.getElementById("street");
const suggestionBox = document.getElementById("suggestions");
input.addEventListener("input", function() {
    let query = this.value.toLowerCase().trim();
    suggestionBox.innerHTML = "";
    if (query.length === 0) {
        suggestionBox.style.display = "none";
        return;
    }

    let matches = streets.filter(street =>
        street.toLowerCase().startsWith(query)
    );

    matches.slice(0, 10).forEach(street => {
        let li = document.createElement("li");
        li.textContent = street;
        li.addEventListener("click", function() {
            input.value = street;
            suggestionBox.innerHTML = "";
            suggestionBox.style.display = "none";
            input.style.backgroundColor = '#B1FCCC'
        });
        suggestionBox.appendChild(li);
    });

    if (matches.length > 0) {
        suggestionBox.style.display = "block";
    } else {
        suggestionBox.style.display = "none";
    }
});

input.addEventListener("blur", function() {
    setTimeout(() => {
        suggestionBox.style.display = "none";
    }, 250); 
});

input.addEventListener("focus", function() {
    if(input.value.length > 0 && !streets.includes(input.value)) {
        suggestionBox.style.display = "block";
    }
    input.style.backgroundColor = 'white'
});



document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
})

document.addEventListener('touchmove', function (e) {
    if (e.scale !== 1) {
        e.preventDefault();
    }
}, { passive: false });


async function abschicken(straße) {
    const response = await fetch("/api/streets", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            street: straße
        })
    });
    return await response.json();
}



</script>


</body>
